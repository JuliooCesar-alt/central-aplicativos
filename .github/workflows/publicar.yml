name: Publicar versão aprovada
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe PowerShell 5.1
        shell: powershell
        run: .\ferramentas\validar-script.ps1
      - name: Validar catálogo e gerar pacote
        shell: pwsh
        run: python ferramentas/empacotar.py
      - name: Publicar GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME dist/Central-de-Aplicativos-Windows.zip dist/SHA256SUMS.txt --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME dist/Central-de-Aplicativos-Windows.zip dist/SHA256SUMS.txt --title $env:GITHUB_REF_NAME --generate-notes --verify-tag
          }
